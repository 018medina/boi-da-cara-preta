<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo do Boi da Cara Preta: ajude o boi a pular mandacarus, cercas e urubus enquanto persegue o menino.">
<meta name="theme-color" content="#efe4d2">
<title>Boi da Cara Preta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: one stage card centered, pixel-art canvas on top, controls + hint below. Single committed "sertão ao entardecer" look. */
:root{
  --sky:#bfe0d8; --sky2:#f2c99a; --earth:#c98a3e; --soil:#8a4f1f;
  --ink:#24180f; --cream:#f7f1e6; --cactus:#3f7a4a; --page:#efe4d2; --muted:#6b5442; --accent:#b8442b;
  --f-pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  --f-body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);padding-inline:16px;padding-block:24px;box-sizing:border-box}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
h1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(20px,4.4vw,32px);margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.hi{font-family:var(--f-pixel);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sky);box-shadow:6px 6px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.controls button{flex:1 1 140px;font-family:var(--f-pixel);font-size:16px;padding:14px 10px;border:3px solid var(--ink);border-radius:6px;background:var(--cream);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.controls button:active,.controls button.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);background:var(--sky2)}
.controls button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin:0;max-width:65ch}
kbd{font-family:var(--f-pixel);font-size:12px;border:2px solid var(--muted);border-bottom-width:3px;border-radius:4px;padding:0 5px;color:var(--ink);background:var(--cream)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Boi da Cara <span>Preta</span></h1>
    <div class="hi" id="hiLbl">RECORDE 00000</div>
  </header>
  <div class="stage"><canvas id="c" width="800" height="260" aria-label="Jogo: o boi corre e pula obstáculos"></canvas></div>
  <div class="controls">
    <button id="bJump" type="button">▲ Pular</button>
    <button id="bDuck" type="button">▼ Abaixar</button>
  </div>
  <p class="hint">Pule com <kbd>Espaço</kbd> ou <kbd>↑</kbd> (ou toque na tela). Abaixe com <kbd>↓</kbd> para passar por baixo do urubu. Mandacaru, cerca e urubu derrubam o boi. A velocidade aumenta com o tempo.</p>
</div>

<script>
(()=>{
const C=document.getElementById('c'), x=C.getContext('2d');
const W=800,H=260,GROUND=222,PX=4;
function resize(){const d=Math.min(window.devicePixelRatio||1,2);C.width=W*d;C.height=H*d;x.setTransform(d,0,0,d,0,0);x.imageSmoothingEnabled=false;}
resize(); addEventListener('resize',resize);

const css=getComputedStyle(document.documentElement);
const col=n=>css.getPropertyValue(n).trim();
const PAL={W:'#f7f1e6',B:'#1d1612',H:'#efe3c8',E:'#ffffff',N:'#c9776b',T:'#1d1612',G:'#3f7a4a',g:'#5c9a5e',F:'#7a4a22',R:'#9a6332',K:'#2a2420',r:'#b85a48',S:'#c68b5e',h:'#3a2416',s:'#d9473a',b:'#2f5d8a'};

function sprite(rows,px=PX){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w*px;c.height=h*px;
  const g=c.getContext('2d');
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(PAL[ch]){g.fillStyle=PAL[ch];g.fillRect(i*px,j*px,px,px);}}));
  return c;
}

// ---------- Boi ----------
const top=["..............H...H.","..............HBBBH.",".............BBBBBB.",".............BBEBBB.","..WWWWWWWWWWWBBBBBBB",".WWWWBBWWWWWWWBBBNNB","TWWWBBBWWWWWWWWBBBB.","TWWWWBBWWWWWWWW.....",".WWWWWWWWWWWWWW.....",".WWWWWWWWWWWWWW....."];
const legA=["..WW..WW...WW..WW...","..BB..BB...BB..BB..."];
const legB=["...WW.WW....WW.WW...","...BB.BB....BB.BB..."];
const legAir=["..WW..WW...WW..WW...","..BB..BB...BB..BB..."];
const duckTop=["...............H..H.","..WWWWWWWWWWWWHBBBH.",".WWWWBBWWWWWWWBBEBBB","TWWWBBBWWWWWWWBBBBNN","TWWWWBBWWWWWWWWBBBB.",".WWWWWWWWWWWWWW.....",".WWWWWWWWWWWWWW....."];
const BOI={run:[sprite([...top,...legA]),sprite([...top,...legB])],air:sprite([...top,...legAir]),duck:[sprite([...duckTop,...legA]),sprite([...duckTop,...legB])],
  dead:sprite(top.map((r,i)=>i===3?".............BBHBBB.":r).concat(legAir))};

// ---------- Obstáculos ----------
const cactusRows=["...GG...","...Gg...","G..Gg...","G..Gg..G","Gg.Gg..G","GGGGg.gG","...GgGGG","...Gg...","...Gg...","...GG...","...Gg...","...GG..."];
const cactusSmall=["..G...","G.Gg..","G.Gg.G","GGGg.G","..GgGG","..Gg..","..GG..","..Gg.."];
const fenceRows=["F.....F.....F","FRRRRRFRRRRRF","F.....F.....F","F.....F.....F","FRRRRRFRRRRRF","F.....F.....F","F.....F.....F","F.....F.....F"];
const birdA=["K...........","KK..........",".KKK........","..KKKK...KK.","..KKKKKKKKKr","...KKKKKK..."];
const birdB=["............","............",".........KK.","..KKKKKKKKKr","..KKKKKK....",".KKK........","KK.........."];
// ---------- Menino ----------
const kidTop=["..hhhh..",".hhhhhh.",".hSSSBS.",".SSSSSS.","..SSSS..","..ssss..","SssssssS","..ssss..","..bbbb.."];
const KID={run:[sprite([...kidTop,".b...b..","S.....S.","BB.....BB"],3),sprite([...kidTop,"...bb...","...SS...","...BB..."],3)],
  air:sprite([...kidTop,".bb..bb.",".S....S.",".B....B."],3)};
const SPR={cactus:sprite(cactusRows),cactusS:sprite(cactusSmall),fence:sprite(fenceRows),bird:[sprite(birdA),sprite(birdB)]};

// ---------- Som ----------
let AC=null;
function beep(f1,f2,dur,type='square',vol=.05){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+dur);}catch(e){}
}
const sfx={jump:()=>beep(420,760,.12),point:()=>{beep(880,880,.08);setTimeout(()=>beep(1320,1320,.12),90)},moo:()=>{beep(180,95,.7,'sawtooth',.07)}};

// ---------- Estado ----------
let hi=0; try{hi=+localStorage.getItem('boi-hi')||0}catch(e){}
const hiLbl=document.getElementById('hiLbl');
const pad=n=>String(Math.floor(n)).padStart(5,'0');
hiLbl.textContent='RECORDE '+pad(hi);

let S;
function reset(){
  S={state:S?S.state:'ready',speed:360,dist:0,score:0,lastMilestone:0,flash:0,
     boi:{y:0,vy:0,duck:false,frame:0,ft:0},kid:{x:270,y:0,vy:0,say:'',sayT:0,nextSay:2},obs:[],nextGap:300,clouds:[],hills:0,pebbles:[],t:0};
  for(let i=0;i<4;i++)S.clouds.push({x:Math.random()*W,y:20+Math.random()*60,s:.5+Math.random()*.5});
  for(let i=0;i<30;i++)S.pebbles.push({x:Math.random()*W,y:GROUND+6+Math.random()*30,w:Math.random()<.3?8:4});
}
reset();

const keys={duck:false};
function jump(){
  if(S.state==='ready'){S.state='run';}
  if(S.state==='over'){if(S.overT>.35){S.state='run';reset();}return;}
  if(S.boi.y===0&&!keys.duck){S.boi.vy=-780;sfx.jump();}
}
function setDuck(v){keys.duck=v; if(S.state==='ready'&&v)S.state='run';}

addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump();}
  else if(e.code==='Enter'){e.preventDefault();jump();}
  else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();setDuck(true);}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))setDuck(false);});
C.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
const bJ=document.getElementById('bJump'),bD=document.getElementById('bDuck');
bJ.addEventListener('pointerdown',e=>{e.preventDefault();bJ.classList.add('on');jump();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bJ.addEventListener(ev,()=>bJ.classList.remove('on')));
bJ.addEventListener('click',e=>{if(e.detail===0)jump();});
bD.addEventListener('pointerdown',e=>{e.preventDefault();bD.classList.add('on');bD.setPointerCapture?.(e.pointerId);setDuck(true);});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>bD.addEventListener(ev,()=>{bD.classList.remove('on');setDuck(false);}));

// ---------- Obstáculos ----------
function spawn(){
  const r=Math.random(), birdsOK=S.score>250;
  let o;
  if(birdsOK&&r<.25){
    const low=Math.random()<.5;
    const h=28; const bottom=low?GROUND-8:GROUND-42;
    o={kind:'bird',x:W+20,y:bottom-h,w:48,h,ft:0};
  }else if(r<.45){
    o={kind:'fence',x:W+20,w:SPR.fence.width,h:SPR.fence.height};o.y=GROUND-o.h;
  }else{
    const n=1+Math.floor(Math.random()*(S.speed>480?3:2));
    const parts=[];let w=0;
    for(let i=0;i<n;i++){const s=Math.random()<.5?SPR.cactus:SPR.cactusS;parts.push({s,dx:w});w+=s.width-4;}
    const h=Math.max(...parts.map(p=>p.s.height));
    o={kind:'cactus',x:W+20,y:GROUND-h,w:w+4,h,parts};
  }
  S.obs.push(o);
  const minGap=S.speed*.62, maxGap=S.speed*1.5;
  S.nextGap=minGap+Math.random()*(maxGap-minGap)+o.w;
}

function boiBoxes(){
  const b=S.boi, X=60;
  if(b.duck&&b.y===0){const y=GROUND-36;return[{x:X+6,y:y+6,w:52,h:28},{x:X+56,y:y+4,w:22,h:16}];}
  const y=GROUND-48+b.y;return[{x:X+6,y:y+18,w:52,h:28},{x:X+54,y:y+4,w:24,h:22}];
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// ---------- Loop ----------
let last=performance.now();
function step(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;
  update(dt);draw();requestAnimationFrame(step);
}
function update(dt){
  S.t+=dt;
  S.clouds.forEach(c=>{c.x-=(S.state==='run'?S.speed*.12:12)*c.s*dt;if(c.x<-80){c.x=W+Math.random()*100;c.y=20+Math.random()*60;}});
  const k=S.kid;
  k.sayT=Math.max(0,k.sayT-dt);
  if(S.state==='over'){
    S.overT+=dt;
    if(k.y<0){k.vy+=2600*dt;k.y=Math.min(0,k.y+k.vy*dt);}
    if(S.overT<dt*1.5){k.say='Ufa! Escapei!';k.sayT=3;}
    return;
  }
  const b=S.boi;
  b.ft+=dt; if(b.ft>.1){b.ft=0;b.frame^=1;}
  if(S.state!=='run')return;

  // menino: corre na frente, olha pra trás e pula sozinho
  k.x=270+Math.sin(S.t*0.7)*35;
  k.vy+=2600*dt;k.y+=k.vy*dt;if(k.y>=0){k.y=0;k.vy=0;}
  if(k.y===0){
    for(const o of S.obs){
      const d=o.x-(k.x+24);
      const needs=o.kind!=='bird'||o.y+o.h>GROUND-36;
      if(needs&&d>0&&d<S.speed*.16){k.vy=-760;break;}
    }
  }
  k.nextSay-=dt;
  if(k.nextSay<=0){
    const falas=['Socorro!','Careta não!','Sai, boi!','Mãe!!','Tenho medo!'];
    k.say=falas[Math.floor(Math.random()*falas.length)];k.sayT=1.4;k.nextSay=4+Math.random()*4;
  }

  S.speed=Math.min(360+S.dist*.012,900);
  const dx=S.speed*dt; S.dist+=dx; S.score=S.dist/10; S.hills+=dx;
  // física
  b.vy+= (keys.duck&&b.y<0?6200:2600)*dt; b.y+=b.vy*dt;
  if(b.y>=0){b.y=0;b.vy=0;}
  b.duck=keys.duck;
  // chão
  S.pebbles.forEach(p=>{p.x-=dx;if(p.x<-10){p.x=W+Math.random()*40;p.y=GROUND+6+Math.random()*30;}});
  // obstáculos
  S.obs.forEach(o=>{o.x-=dx*(o.kind==='bird'?1.12:1);if(o.kind==='bird'){o.ft+=dt;}});
  S.obs=S.obs.filter(o=>o.x+o.w>-20);
  const lastO=S.obs[S.obs.length-1];
  if(!lastO||W-lastO.x>S.nextGap)spawn();
  // colisão
  const bx=boiBoxes();
  for(const o of S.obs){
    const ob={x:o.x+5,y:o.y+5,w:o.w-10,h:o.h-8};
    if(bx.some(r=>hit(r,ob))){
      S.state='over';S.overT=0;sfx.moo();
      if(S.score>hi){hi=Math.floor(S.score);try{localStorage.setItem('boi-hi',hi)}catch(e){}hiLbl.textContent='RECORDE '+pad(hi);}
      return;
    }
  }
  const m=Math.floor(S.score/100);
  if(m>S.lastMilestone){S.lastMilestone=m;S.flash=.8;sfx.point();}
  S.flash=Math.max(0,S.flash-dt);
}

function draw(){
  // céu em degradê de fim de tarde
  const g=x.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,col('--sky'));g.addColorStop(1,col('--sky2'));
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // sol
  x.fillStyle='#f6b04f';x.beginPath();x.arc(640,GROUND-34,34,0,Math.PI*2);x.fill();
  // nuvens
  x.fillStyle='rgba(255,255,255,.85)';
  S.clouds.forEach(c=>{const s=Math.round(4*c.s)*2||4;x.fillRect(c.x,c.y,s*10,s*2);x.fillRect(c.x+s*2,c.y-s*2,s*5,s*2);x.fillRect(c.x+s,c.y+s*2,s*8,s);});
  // morros distantes (parallax)
  x.fillStyle='#d9a56a';
  for(let i=-1;i<6;i++){const off=((i*220-(S.hills*.15)%220)+220)%1540-220;x.beginPath();x.moveTo(off,GROUND);x.quadraticCurveTo(off+110,GROUND-70-(i%2)*25,off+240,GROUND);x.fill();}
  // chão
  x.fillStyle=col('--earth');x.fillRect(0,GROUND,W,H-GROUND);
  x.fillStyle=col('--soil');x.fillRect(0,GROUND,W,3);
  S.pebbles.forEach(p=>x.fillRect(Math.round(p.x),Math.round(p.y),p.w,3));
  // obstáculos
  S.obs.forEach(o=>{
    if(o.kind==='cactus')o.parts.forEach(p=>x.drawImage(p.s,Math.round(o.x+p.dx),GROUND-p.s.height));
    else if(o.kind==='fence')x.drawImage(SPR.fence,Math.round(o.x),o.y);
    else x.drawImage(SPR.bird[Math.floor(o.ft*6)%2],Math.round(o.x),o.y);
  });
  // boi
  const b=S.boi; let spr,by;
  if(S.state==='over'){spr=BOI.dead;by=GROUND-spr.height+b.y;}
  else if(b.y<0){spr=BOI.air;by=GROUND-spr.height+b.y;}
  else if(b.duck){spr=BOI.duck[b.frame];by=GROUND-spr.height;}
  else{spr=S.state==='run'?BOI.run[b.frame]:BOI.run[0];by=GROUND-spr.height;}
  x.drawImage(spr,60,Math.round(by));
  // menino
  const k=S.kid;
  const ks=k.y<0?KID.air:KID.run[S.state==='run'?b.frame:0];
  const ky=Math.round(GROUND-ks.height+k.y), kx=Math.round(k.x);
  x.drawImage(ks,kx,ky);
  if(k.sayT>0){
    x.font='400 13px Rubik, system-ui, sans-serif';x.textAlign='left';x.textBaseline='middle';
    const tw=x.measureText(k.say).width+14, bx2=kx+8, by2=ky-30;
    x.fillStyle='#f7f1e6';x.fillRect(bx2,by2,tw,22);
    x.fillStyle=col('--ink');x.fillRect(bx2,by2,tw,2);x.fillRect(bx2,by2+20,tw,2);x.fillRect(bx2,by2,2,22);x.fillRect(bx2+tw-2,by2,2,22);
    x.fillStyle='#f7f1e6';x.fillRect(bx2+6,by2+20,6,6);x.fillStyle=col('--ink');x.fillRect(bx2+4,by2+22,2,6);
    x.fillText(k.say,bx2+7,by2+11);
  }
  // placar
  x.font='700 18px Silkscreen, monospace';x.textAlign='right';x.textBaseline='top';
  const blink=S.flash>0&&Math.floor(S.flash*8)%2===0;
  x.fillStyle=col('--ink');
  if(!blink)x.fillText(pad(S.score),W-16,14);
  x.fillStyle=col('--muted');x.fillText('HI '+pad(hi),W-120,14);
  // telas
  x.textAlign='center';
  if(S.state==='ready'){
    panel('PEGA ESSE MENINO!','Toque ou aperte Espaço para correr');
  }else if(S.state==='over'){
    panel('Ô BOI! FIM DE JOGO','Toque ou aperte Espaço para tentar de novo');
  }
}
function panel(t,s){
  x.fillStyle='rgba(36,24,15,.82)';x.fillRect(W/2-230,62,460,80);
  x.fillStyle='#f7f1e6';x.font='700 24px Silkscreen, monospace';x.fillText(t,W/2,76);
  x.font='400 15px Rubik, system-ui, sans-serif';x.fillStyle='#f2c99a';x.fillText(s,W/2,112);
}
requestAnimationFrame(step);
})();
</script>
</body>
</html>
